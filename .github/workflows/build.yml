# Builds the Fabric and NeoForge jars for Minecraft 1.21.1 on every push and pull request, runs
# the unit tests (the shared ones run once in common and once on NeoForge's classes), then runs
# both in-game tests (Fabric's in fabric/src/gametest, NeoForge's in neoforge/src/clienttest) on a
# virtual display. The two jars are attached to each run under "Artifacts", and the game tests'
# screenshots alongside them.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        # The code is compiled for Java 21 (1.21.1's) by this newer JDK.
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: run game test
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest
      - name: run NeoForge game test
        # A failed check crashes the game, which fails this step; the crash report is uploaded
        # with the screenshots.
        if: always()
        timeout-minutes: 12
        run: xvfb-run -a ./gradlew :neoforge:runClientTest
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots
          path: |
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/crash-reports/
            neoforge/build/run/clientTest/screenshots/
            neoforge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
