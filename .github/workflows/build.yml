# Builds the Fabric and Forge jars for Minecraft 1.20.1 on every push and pull request, runs
# the unit tests (the shared ones run once in common and once on Forge's classes), then runs both
# in-game tests (Fabric's in fabric/src/gametest, Forge's in forge/src/clienttest) on a virtual
# display. The two jars are attached to each run under "Artifacts", and the game tests'
# screenshots alongside them.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdks
        # Forge's build tools need Java 17; Gradle itself runs on the newer one, and the code is
        # compiled for Java 17 by either. Both are installed, and Gradle finds the 17 by its
        # environment variable.
        uses: actions/setup-java@v5
        with:
          java-version: |
            17
            25
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
      - name: run game test
        timeout-minutes: 15
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
      - name: run Forge game test
        # A failed check crashes the game, which fails this step; the crash report is uploaded
        # with the screenshots.
        if: always()
        timeout-minutes: 12
        run: xvfb-run -a ./gradlew :forge:runClientTest -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots
          path: |
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/crash-reports/
            forge/build/run/clientTest/screenshots/
            forge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            forge/build/libs/
