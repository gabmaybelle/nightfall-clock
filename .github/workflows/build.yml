# Builds the mod on every push and pull request, so a broken build shows up straight away.
# It builds against each Minecraft version the mod supports and runs the in-game tests on
# each (fabric/src/gametest and neoforge/src/clienttest), since a vanilla change can compile fine and still crash on launch.
# The Fabric and NeoForge jars built against 26.2 (the ones players get) are attached to each run under "Artifacts",
# and each version's game-test screenshots alongside it.

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          # The versions in gradle.properties.
          - minecraft: '26.2'
            gradle_args: ''
          - minecraft: '26.3'
            gradle_args: '-Pminecraft_version=26.3 -Pfabric_api_version=0.162.0+26.3 -Pneoforge_version=26.3.0.77'
    name: build (Minecraft ${{ matrix.minecraft }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: build
        run: ./gradlew build ${{ matrix.gradle_args }}
      - name: install EGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      - name: run game test
        # From 26.3 the game asks for an sRGB-capable window, which Xvfb's GLX can't give, so
        # the game would hang at startup. Mesa's EGL can; SDL uses it with this set.
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 10
        run: xvfb-run -a ./gradlew :fabric:runClientGameTest ${{ matrix.gradle_args }}
      - name: run NeoForge game test
        # The same checks on the NeoForge jar (neoforge/src/clienttest). A failed check crashes the
        # game, which fails this step; the crash report is uploaded below.
        if: always()
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 12
        run: xvfb-run -a ./gradlew :neoforge:runClientTest ${{ matrix.gradle_args }}
      - name: run Paper server test
        # The Paper plugin (paper/) on a real Paper server: no window, so no virtual display
        # needed. Checks what the clock reads at several times of day, the countdown to dark,
        # dusk and thunder arriving, and the Overworld's time in the Nether. The plugin doesn't
        # depend on the Minecraft version the mod is built against, so it runs once.
        if: always() && matrix.minecraft == '26.2'
        timeout-minutes: 10
        run: node tools/paper-server-test.js paper/run --plugin "$(ls paper/build/libs/nightfallclock-paper-*.jar | grep -v sources)" --eula
      - name: capture game test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (Minecraft ${{ matrix.minecraft }})
          path: |
            fabric/build/run/clientGameTest/screenshots/
            neoforge/build/run/clientTest/screenshots/
            neoforge/build/run/clientTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        if: matrix.minecraft == '26.2'
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            fabric/build/libs/
            neoforge/build/libs/
            paper/build/libs/
