plugins {
	id 'net.neoforged.moddev.legacyforge' version "${moddev_version}"
}

repositories {
	maven { url = 'https://maven.minecraftforge.net' }
}

// The common sources are compiled straight into this jar, the same as the Fabric side.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}
// And the shared unit tests run here too, so they prove the common code on Forge's classes as well.
sourceSets.test {
	java.srcDir project(':common').file('src/test/java')
}
// The in-game test (src/clienttest): part of the mod only in dev runs, never in the jar.
sourceSets {
	clienttest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

legacyForge {
	version = "${project.minecraft_version}-${project.forge_version}"
	addModdingDependenciesTo sourceSets.clienttest

	mods {
		"nightfallclock" {
			sourceSet sourceSets.main
			// The same mod as the main sources, so the test can reach the package's own classes.
			sourceSet sourceSets.clienttest
		}
	}

	runs {
		client {
			client()
		}
		// `./gradlew :forge:runClientTest`: starts the game, makes a flat world, runs the checks in
		// src/clienttest and closes. A failed check crashes the game, so the task fails. Needs a display.
		clientTest {
			client()
			systemProperty 'nightfallclock.clienttest', 'true'
			gameDirectory = project.file('build/run/clientTest')
		}
	}

	// Puts Minecraft and Forge on the test classpath (the legacy plugin has no unitTest block), so the
	// tests that use the game's classes, such as Component, run.
	addModdingDependenciesTo sourceSets.test
}

// Every test run starts with the default settings; the run folder is kept between runs otherwise.
tasks.matching { it.name == 'runClientTest' }.configureEach {
	doFirst {
		delete file('build/run/clientTest/config/nightfallclock.properties')
	}
}

dependencies {
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	clienttestAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

mixin {
	add sourceSets.main, 'nightfallclock.refmap.json'
	config 'nightfallclock.mixins.json'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/mods.toml") {
		expand "version": version
	}
	// Forge reads the mixin refmap by name from the config; Fabric's Loom adds its own, so only
	// this jar's copy of the shared mixin config names one.
	filesMatching("nightfallclock.mixins.json") {
		filter { it.replace('"required": true,', '"required": true,\n\t"refmap": "nightfallclock.refmap.json",') }
	}
}

// Forge's tools run on Java 17, which Gradle must be able to find (see CLAUDE.md); the code itself is
// compiled by the newer JDK for Java 17 (release 17 in the root build.gradle).
java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
	manifest.attributes(["MixinConfigs": "nightfallclock.mixins.json"])
}

tasks.named('jar') { archiveBaseName = "${rootProject.name}-forge" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-forge" }

// The game runs (dev client, game tests) use Java 17, as players' 1.20.1 does: the Mixin of 1.20.1's
// loaders can't read the classes of a newer Java.
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
