plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

fabricApi {
	// An in-game test mod in src/gametest: ./gradlew :fabric:runClientGameTest
	configureTests {
		createSourceSet = true
		modId = "nightfallclock-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

loom {
	mods {
		"nightfallclock" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// Optional: only for the settings button in Mod Menu.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// Filming only, `-PvideoMods=<folder>`: also load every jar in that folder (Iris and Sodium for a
	// shader, Replay Mod) in the game test. Never part of the mod.
	if (project.hasProperty("videoMods")) {
		runtimeOnly fileTree(project.videoMods) { include "*.jar" }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// `./gradlew :fabric:runClientGameTest -PvideoTour` also films the Short (VideoTour), frames in
// build/run/clientGameTest/video_tour. Every other -Pvideo... property is passed on to it:
// -PvideoScenes=<scene,scene,s_*> films only those scenes, -PvideoScout takes stills per scene,
// -PvideoWorld=<zip> films in a saved world, -PvideoSkin=<png> dresses the player.
// Without -PvideoTour the game test runs as usual.
if (project.hasProperty("videoTour")) {
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		systemProperty 'nightfallclock.videoTour', 'true'
		// -PvideoShaders=<shader pack zip>: film with that Iris shader pack on (Iris and Sodium come in
		// with -PvideoMods). Copied into the game's own run folder before launch, where Iris reads it
		// as the game starts (as Cozy Core's filming does).
		if (project.hasProperty('videoShaders')) {
			def pack = file(project.videoShaders)
			def run = file('build/run/clientGameTest')
			doFirst {
				copy { from pack; into new File(run, 'shaderpacks') }
				def config = new File(run, 'config/iris.properties')
				config.parentFile.mkdirs()
				config.text = "enableShaders=true\nshaderPack=${pack.name}\n"
			}
		}
		project.properties.each { name, value ->
			if (name.startsWith('video') && name != 'videoTour') {
				// A bare flag (-PvideoScout) arrives empty: pass it on as true.
				systemProperty "nightfallclock.${name}", value.toString().isEmpty() ? 'true' : value.toString()
			}
		}
	}
}

// nightfallclock-fabric-<version>.jar, the name players download.
tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }
